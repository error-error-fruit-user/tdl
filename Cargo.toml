[package]
name = "tdl"
version = "0.6.0"
edition = "2024"
license = "0BSD"

[dependencies]
blake3 = "1.8.7"
directories = "6.0.0"
ratatui = "0.30.2"
rfd = "0.17.2"
rmp-serde = "1.3.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tiny_http = "0.12.0"
ureq = "3.4.2"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
