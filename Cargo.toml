[package]
name = "tdl"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
license = "0BSD"

[features]
# Builds with nightly Rust's unstable features (`associated_type_defaults`, for `Ritual::Tea`, and
# the ones `ritual.rs` only uses for fun inside `after_dark!`):
# `cargo +nightly build --features spooky`. Without it, tdl builds on stable.
spooky = []

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.5.41", features = ["derive", "wrap_help"] }
directories = "6.0.0"
ratatui = { version = "0.30.2", features = ["serde"] }
rfd = "0.17.2"
rmp-serde = "1.3.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "flac", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tiny_http = "0.12.0"
toml = "1.1.8"
ureq = "3.4.2"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
