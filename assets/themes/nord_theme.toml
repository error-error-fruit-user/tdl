# nord: arctic: Nord's polar night blues with its frost and aurora. Comes with tdl: wear it with
# `tdl --theme nord`; it goes with `--splash nord`. The colors are Nord by Arctic Ice Studio, MIT.
# Every field is explained in THEME.md.

edition = 2

[colors]
background = "#2E3440"
text = "#D8DEE9"
muted = "#4C566A"
title = "#ECEFF4"
key = "#EBCB8B"
screen = "#88C0D0"
multiplayer = "#81A1C1"
netplay = "#B48EAD"
dialog = "#D8DEE9"
warning = "#BF616A"
legend = "#4C566A"
panel = "#434C5E"
busy = "#88C0D0"
hashing = "#A3BE8C"
unsealing = "#B48EAD"
quip = "#EBCB8B"
good = "#A3BE8C"
bad = "#BF616A"
changed = "#D08770"
volatile = "#B48EAD"
divider = "#434C5E"
gauge = "#3B4252"
gauge_label = "#D8DEE9"

[styles]
cursor = { fg = "#2E3440", bg = "#88C0D0", bold = true }
broken_cursor = { fg = "#2E3440", bg = "#BF616A", bold = true }
selected = { fg = "#D8DEE9", bg = "#434C5E" }
broken_row = { fg = "#D8DEE9", bg = "#57414C" }
header = { fg = "#4C566A", bold = true }
broken_badge = { fg = "#2E3440", bg = "#BF616A", bold = true }
changed_badge = { fg = "#2E3440", bg = "#D08770", bold = true }
volatile_badge = { fg = "#2E3440", bg = "#B48EAD", bold = true }

[borders]
window = "rounded"
popup = "plain"

[help]
heading = "#88C0D0"
literal = "#EBCB8B"
placeholder = "#D8DEE9"
error = "#BF616A"
valid = "#A3BE8C"
invalid = "#D08770"
