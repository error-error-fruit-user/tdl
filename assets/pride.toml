# tdl's pride splash, played with --with-pride or the "pride" setting: the logo in a pride
# flag's stripes over a fire that burns through the rainbow. Change anything below, or leave it
# out for the built-in pride's. Every field is explained in SPLASH.md.
#
# A color is "#rrggbb", a terminal color's name ("red", "lightmagenta", "darkgray", ...), a
# terminal palette number ("0" to "255"), or "reset" for the terminal's own.

edition = 1

[fire]
# The fire behind every flag that has none of its own, written the same way as in splash.toml:
# a single color glows, a list of colors is shaded from coldest to hottest, and the fire cycles
# through them all, `speed` flames a second.
flames = ["#FF0000", "#FF8000", "#FFFF00", "#00FF00", "#0080FF", "#8000FF"]
speed = 1.0

# The flags. Each splash plays one of those left in, picked at random. Take the # off the start
# of a flag's lines to put it in, or put one on to leave it out. A flag's stripes go from top to
# bottom, as many as it has, spread evenly over the logo. A flag may also have a fire of its own:
#   fire = { flames = ["#5BCEFA", "#F5A9B8", "white"], speed = 0.5 }
# With no flags left in, the pride splash keeps the usual logo and only burns the pride fire.

[[flag]]
name = "transgender"
stripes = ["#5BCEFA", "#F5A9B8", "#FFFFFF", "#F5A9B8", "#5BCEFA"]

